<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
</head>

<body>
    <main>
        <div id="dashboard">
            <div class = "card" id = "notification"><p>notification</p></div>
            <div class = "card" id = "clock"><p></p></div>
            <div class = "card" id = "calendar"><p>calendar</p></div>
            <div class = "card" id = "transit"><p>transit</p></div>
            <div class = "card" id = "photo"><p>photo</p></div>
            <div class = "card" id = "weather">
                <p class = "big" id = "ctemperature"></p>
                <p class = "small" id = desctemperature></p>
                <p>&nbsp;</p>
                <p>Feels Like: <span id = "ftemperature"></span></p>
                <p>Min: <span id = "mintemperature"></span>&nbsp;&nbsp;&nbsp;Max: <span id = "maxtemperature"></span></p>
                <p id = "rainfontsize"><span id = "raintemperature"></span>% Chance Rain Today</p>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
